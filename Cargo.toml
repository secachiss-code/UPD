[package]
name = "cm"
version = "0.2.8"
edition = "2024"
license = "MIT"

[lib]
name = "cm"
path = "src/lib.rs"

[[bin]]
name = "cm"
path = "src/main.rs"

[dependencies]
flate2 = "1.1.10"
libc = "0.2.189"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
saphyr-parser = { version = "=0.1.0", default-features = false }
serde_yaml = "0.9.34"
sha1_smol = "1.0.1"
sha2 = "0.11.0"
ureq = "2"
url = "2.5"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
