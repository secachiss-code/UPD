# Описание пакетов cm для nfpm: одно на все форматы (arch, deb, rpm).
# Собирается через ./package.sh — он подставляет VERSION и STAGE (файлы от `cm gen-files`).
name: cm
arch: amd64
platform: linux
version: ${VERSION}
release: 1
section: admin
priority: optional
maintainer: somovas
description: |
  Обновление системы с автоподбором зеркал и VPN на ядре mihomo.
  Один статический бинарник: pacman, apt, dnf, zypper; Flatpak, AUR, прошивки,
  снапшоты; VPN с подписками, TUN, правилами и геофайлами — всё в TUI.
conflicts:
  - upd
replaces:
  - upd
license: MIT
homepage: https://github.com/somovas/upd
provides:
  - cm
contents:
  - src: LICENSE
    dst: /usr/share/licenses/cm/LICENSE
    file_info:
      mode: 0644
  - src: ${STAGE}/usr/bin/cm
    dst: /usr/bin/cm
    file_info:
      mode: 0755
  - src: ${STAGE}/usr/lib/systemd/
    dst: /usr/lib/systemd/
    type: tree
  - src: ${STAGE}/usr/lib/NetworkManager/
    dst: /usr/lib/NetworkManager/
    type: tree
  - src: ${STAGE}/extra/usr/share/
    dst: /usr/share/
    type: tree
  - src: ${STAGE}/extra/etc/
    dst: /etc/
    type: tree
scripts:
  postinstall: packaging/scripts/postinstall.sh
  preremove: packaging/scripts/preremove.sh
archlinux:
  packager: somovas
  scripts:
    postupgrade: packaging/scripts/postinstall.sh
overrides:
  deb:
    recommends: [flatpak, fwupd]
  rpm:
    recommends: [flatpak, fwupd]
