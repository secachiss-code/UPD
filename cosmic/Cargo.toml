[package]
name = "cm-cosmic"
version = "0.2.8"
edition = "2024"
license = "MIT"
description = "cm status applet and TUI launcher for the COSMIC desktop"

# отдельный workspace: основной cm собирается статически (musl), а интерфейсу нужны wayland и GPU (glibc)
[workspace]

[dependencies]
cm = { path = ".." }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
rev = "213b264bd3c0a9c751f0e8664053d59b08b21bba"
default-features = false
features = ["applet", "applet-token", "tokio", "wayland", "dbus-config", "a11y"]

[profile.release]
lto = "thin"
codegen-units = 16
strip = true
opt-level = 3

